name: Apply ReliefRead tester billing setup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-tester-billing.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply ReliefRead tester billing setup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Apply tested billing changes
        run: |
          cat > /tmp/tester-billing.patch <<'PATCH'
diff --git a/.env.example b/.env.example
index f8c4c4d..8e9b14d 100644
--- a/.env.example
+++ b/.env.example
@@ -6,7 +6,21 @@ VITE_APP_VISIBILITY=public
 VITE_PLATFORM_URL=https://www.overskill.com
 VITE_POST_LOGIN_ROUTE=/dashboard
 
-# Optional paid-plan ids from OverSkill Payments / Whop.
+# Tester rollout. Keep true while invited testers should receive all features
+# without payment. Set to false before the paid public launch.
+VITE_TESTER_MODE=true
+
+# Billing provider: none during testing, stripe for the paid production launch.
+VITE_BILLING_PROVIDER=none
+
+# Stripe browser-safe configuration. Do not add Stripe secret keys or webhook
+# secrets to this file, GitHub Pages, or any other frontend environment.
+VITE_STRIPE_PUBLISHABLE_KEY=
+VITE_STRIPE_PRICE_PREMIUM_MONTHLY=
+VITE_STRIPE_PRICE_PREMIUM_ANNUAL=
+VITE_STRIPE_CHECKOUT_ENDPOINT=
+
+# Legacy optional paid-plan ids from OverSkill Payments / Whop.
 VITE_PLAN_PREMIUM_MONTHLY=
 VITE_PLAN_PREMIUM_ANNUAL=
 
diff --git a/STRIPE_SETUP.md b/STRIPE_SETUP.md
new file mode 100644
index 0000000..ada69a2
--- /dev/null
+++ b/STRIPE_SETUP.md
@@ -0,0 +1,54 @@
+# ReliefRead Stripe rollout
+
+## Current tester phase
+
+ReliefRead is running with `VITE_TESTER_MODE=true` and
+`VITE_BILLING_PROVIDER=none`. Signed-in testers can use premium features with
+no payment details and no subscription.
+
+Before opening payments, set tester mode to `false` and enable Stripe only
+after the checkout endpoint and webhook described below are live.
+
+## Stripe products to create
+
+Create one product named **ReliefRead Premium** with two recurring prices:
+
+| Price | Billing period | Suggested launch price |
+| --- | --- | --- |
+| Premium Monthly | Monthly | 49 DKK |
+| Premium Annual | Yearly | 490 DKK |
+
+Save the two Stripe Price IDs. They are safe to use in browser build
+configuration, but Stripe secret keys are not.
+
+## Required secure backend
+
+GitHub Pages is static, so it cannot safely create checkout sessions or verify
+webhooks. Add a small server-side endpoint before enabling billing:
+
+1. `POST /api/stripe/create-checkout-session` accepts a selected Price ID and
+   the signed-in ReliefRead user ID.
+2. The endpoint creates a Stripe Checkout subscription session and returns its
+   URL.
+3. `POST /api/stripe/webhook` verifies Stripe's signature.
+4. On `checkout.session.completed`, `customer.subscription.updated`, and
+   `customer.subscription.deleted`, it updates the user's ReliefRead plan.
+5. The Stripe secret key and webhook secret live only in that backend's secret
+   store.
+
+## Frontend configuration after the backend exists
+
+Set these production build values:
+
+```text
+VITE_TESTER_MODE=false
+VITE_BILLING_PROVIDER=stripe
+VITE_STRIPE_PUBLISHABLE_KEY=pk_live_...
+VITE_STRIPE_PRICE_PREMIUM_MONTHLY=price_...
+VITE_STRIPE_PRICE_PREMIUM_ANNUAL=price_...
+VITE_STRIPE_CHECKOUT_ENDPOINT=https://api.reliefread.com/api/stripe/create-checkout-session
+```
+
+Use Stripe test mode first with `pk_test_...` and test Price IDs. Verify that a
+successful payment grants Premium and cancellation returns the user to Free at
+the end of the paid period.
diff --git a/src/hooks/usePremium.ts b/src/hooks/usePremium.ts
index a632fed..4d5f39f 100644
--- a/src/hooks/usePremium.ts
