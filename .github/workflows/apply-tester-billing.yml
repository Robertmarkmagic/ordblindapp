PATCH
          git apply --whitespace=nowarn /tmp/tester-billing.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example STRIPE_SETUP.md src/hooks/usePremium.ts src/lib/billing.ts src/pages/Pricing.tsx
