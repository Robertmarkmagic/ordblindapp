@@ -249,7 +251,11 @@ export default function Pricing() {
                 {redeeming ? <Loader2 className="h-5 w-5 animate-spin" aria-hidden="true" /> : "Apply"}
               </Button>
             </div>
-            {!checkoutConfigured && (
